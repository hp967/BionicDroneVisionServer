name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: macos-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.4'
    
    - name: Install xcodegen
      run: brew install xcodegen
    
    - name: Create iOS App
      run: |
        mkdir -p Sources
        
        cat > Sources/main.swift << 'EOF'
        import SwiftUI
        @main
        struct App: App {
            var body: some Scene {
                WindowGroup {
                    Text("Hello iOS")
                }
            }
        }
        EOF
        
        cat > Sources/Info.plist << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleExecutable</key><string>$(EXECUTABLE_NAME)</string>
            <key>CFBundleIdentifier</key><string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>$(PRODUCT_NAME)</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>LSRequiresIPhoneOS</key><true/>
            <key>UILaunchScreen</key><dict/>
            <key>UIRequiredDeviceCapabilities</key><array><string>arm64</string></array>
            <key>UISupportedInterfaceOrientations</key><array><string>UIInterfaceOrientationPortrait</string></array>
        </dict>
        </plist>
        EOF
        
        ls -la Sources/
    
    - name: Generate Xcode Project with xcodegen
      run: |
        cat > Project.yml << 'EOF'
        name: TestApp
        options:
          bundleIdPrefix: com.test
          deploymentTarget:
            iOS: "16.0"
        targets:
          TestApp:
            type: application
            platform: iOS
            sources:
              - path: Sources
            settings:
              base:
                CODE_SIGNING_REQUIRED: NO
                CODE_SIGNING_ALLOWED: NO
                PRODUCT_BUNDLE_IDENTIFIER: com.test.app
        EOF
        
        xcodegen generate
        ls -la *.xcodeproj/
    
    - name: Build Archive
      run: |
        mkdir -p build
        
        xcodebuild archive \
          -project TestApp.xcodeproj \
          -scheme TestApp \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          -archivePath build/TestApp.xcarchive \
          CODE_SIGNING_ALLOWED=NO \
          2>&1 | tee build.log
        
        echo "=== Result ==="
        if [ -d "build/TestApp.xcarchive/Products/Applications" ]; then
            echo "SUCCESS"
            ls -la build/TestApp.xcarchive/Products/Applications/
        else
            echo "FAILED"
            tail -50 build.log
            exit 1
        fi
    
    - name: Export IPA
      if: success()
      run: |
        cat > export.plist << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>method</key><string>development</string>
            <key>uploadSymbols</key><false/>
        </dict>
        </plist>
        EOF
        
        xcodebuild -exportArchive \
          -archivePath build/TestApp.xcarchive \
          -exportPath build \
          -exportOptionsPlist export.plist \
          2>&1 | tee export.log
        
        ls -la build/*.ipa 2>/dev/null || echo "No IPA created"
    
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: TestApp
        path: build/*.ipa
        if-no-files-found: error
