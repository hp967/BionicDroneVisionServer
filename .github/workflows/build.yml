name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: macos-14
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.4'
    
    - name: Create iOS App with Xcode Project
      run: |
        # Create the app source files
        mkdir -p Sources
        
        cat > Sources/main.swift << 'EOF'
        import SwiftUI
        @main
        struct BionicDroneVisionServerApp: App {
            var body: some Scene {
                WindowGroup {
                    VStack {
                        Image(systemName: "drone.front.closed")
                            .font(.system(size: 60))
                        Text("Bionic Drone Vision Server")
                            .font(.title)
                    }
                    .padding()
                }
            }
        }
        EOF
        
        cat > Sources/Info.plist << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleExecutable</key><string>$(EXECUTABLE_NAME)</string>
            <key>CFBundleIdentifier</key><string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>$(PRODUCT_NAME)</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>LSRequiresIPhoneOS</key><true/>
            <key>UILaunchScreen</key><dict/>
            <key>UIRequiredDeviceCapabilities</key><array><string>arm64</string></array>
            <key>UISupportedInterfaceOrientations</key><array><string>UIInterfaceOrientationPortrait</string></array>
        </dict>
        </plist>
        EOF
        
        echo "Created Sources directory"
        ls -la Sources/
    
    - name: Generate Xcode Project using xcodebuild
      run: |
        # Use xcodebuild to create a project from scratch
        mkdir -p BionicDroneVisionServer.xcodeproj
        
        # Create the project.pbxproj file manually
        cat > BionicDroneVisionServer.xcodeproj/project.pbxproj << 'EOF'
        // !$*UTF8*$!
        {
        	archiveVersion = 1;
        	classes = {
        	};
        	objectVersion = 54;
        	objects = {
        
        /* Begin PBXBuildFile section */
        		1A000001 /* main.swift in Sources */ = {isa = PBXBuildFile; fileRef = 2A000001; };
        /* End PBXBuildFile section */
        
        /* Begin PBXFileReference section */
        		2A000001 /* main.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = main.swift; sourceTree = "<group>"; };
        		3A000001 /* Info.plist */ = {isa = PBXFileReference; lastKnownFileType = text.plist.xml; path = Info.plist; sourceTree = "<group>"; };
        		4A000001 /* BionicDroneVisionServer.app */ = {isa = PBXFileReference; explicitFileType = wrapper.application; includeInIndex = 0; path = BionicDroneVisionServer.app; sourceTree = BUILT_PRODUCTS_DIR; };
        /* End PBXFileReference section */
        
        /* Begin PBXFrameworksBuildPhase section */
        		5A000001 /* Frameworks */ = {isa = PBXFrameworksBuildPhase; buildActionMask = 2147483647; files = ( ); runOnlyForDeploymentPostprocessing = 0; };
        /* End PBXFrameworksBuildPhase section */
        
        /* Begin PBXGroup section */
        		6A000001 = {isa = PBXGroup; children = ( 7A000001, 8A000001, 9A000001 ); sourceTree = "<group>"; };
        		7A000001 /* Sources */ = {isa = PBXGroup; children = ( 2A000001, 3A000001 ); path = Sources; sourceTree = "<group>"; };
        		8A000001 /* Frameworks */ = {isa = PBXGroup; name = Frameworks; sourceTree = "<group>"; };
        		9A000001 /* Products */ = {isa = PBXGroup; children = ( 4A000001 ); name = Products; sourceTree = "<group>"; };
        /* End PBXGroup section */
        
        /* Begin PBXNativeTarget section */
        		10A00001 /* BionicDroneVisionServer */ = {isa = PBXNativeTarget; buildConfigurationList = 11A00002; buildPhases = ( 12A00001, 5A000001 ); buildRules = ( ); dependencies = ( ); name = BionicDroneVisionServer; productName = BionicDroneVisionServer; productReference = 4A000001; productType = "com.apple.product-type.application"; };
        /* End PBXNativeTarget section */
        
        /* Begin PBXProject section */
        		13A00001 /* Project object */ = {isa = PBXProject; attributes = {BuildIndependentTargetsInParallel = 1; }; buildConfigurationList = 14A00002; compatibilityVersion = "Xcode 14.0"; developmentRegion = en; hasScannedForEncodings = 0; knownRegions = ( en, Base ); mainGroup = 6A000001; productRefGroup = 9A000001; projectDirPath = ""; projectRoot = ""; targets = ( 10A00001 ); };
        /* End PBXProject section */
        
        /* Begin PBXSourcesBuildPhase section */
        		12A00001 /* Sources */ = {isa = PBXSourcesBuildPhase; buildActionMask = 2147483647; files = ( 1A000001, ); runOnlyForDeploymentPostprocessing = 0; };
        /* End PBXSourcesBuildPhase section */
        
        /* Begin XCBuildConfiguration section */
        		11A00003 /* Release */ = {isa = XCBuildConfiguration; buildSettings = { ALWAY S_SEARCH_USER_PATHS = NO; CLANG_ENABLE_MODULES = YES; COPY_PHASE_STRIP = NO; DEBUG_INFORMATION_FORMAT = "dwarf-with-dsym"; IPHONEOS_DEPLOYMENT_TARGET = 16.0; MTL_ENABLE_DEBUG_INFO = NO; ONLY_ACTIVE_ARCH = YES; SDKROOT = iphoneos; TARGETED_DEVICE_FAMILY = "1,2"; }; name = Release; };
        		15A00001 /* Release */ = {isa = XCBuildConfiguration; buildSettings = { ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon; CODE_SIGN_STYLE = Automatic; CURRENT_PROJECT_VERSION = 1; GENERATE_INFOPLIST_FILE = NO; INFOPLIST_FILE = Sources/Info.plist; IPHONEOS_DEPLOYMENT_TARGET = 16.0; LD_RUNPATH_SEARCH_PATHS = ( "$(inherited)", "@executable_path/Frameworks" ); PRODUCT_BUNDLE_IDENTIFIER = com.bionicdrone.visionserver; PRODUCT_NAME = "$(TARGET_NAME)"; SWIFT_EMIT_LOC_STRINGS = YES; SWIFT_VERSION = 5.0; TARGETED_DEVICE_FAMILY = "1,2"; }; name = Release; };
        /* End XCBuildConfiguration section */
        
        /* Begin XCConfigurationList section */
        		11A00002 /* Build configuration list for PBXNativeTarget "BionicDroneVisionServer" */ = {isa = XCConfigurationList; buildConfigurations = ( 11A00003 /* Release */ ); defaultConfigurationIsVisible = 0; };
        		14A00002 /* Build configuration list for PBXProject "BionicDroneVisionServer" */ = {isa = XCConfigurationList; buildConfigurations = ( 15A00001 /* Release */ ); defaultConfigurationIsVisible = 0; };
        /* End XCConfigurationList section */
        
        	};
        	rootObject = 13A00001 /* Project object */;
        }
        EOF
        
        echo "Created Xcode project"
        ls -la BionicDroneVisionServer.xcodeproj/
    
    - name: Build Archive
      run: |
        mkdir -p build
        
        echo "Starting archive build..."
        xcodebuild archive \
          -project BionicDroneVisionServer.xcodeproj \
          -scheme BionicDroneVisionServer \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          -archivePath build/BionicDroneVisionServer.xcarchive \
          CODE_SIGNING_ALLOWED=NO \
          2>&1 | tee build.log
        
        echo "=== Archive Result ==="
        if [ -d "build/BionicDroneVisionServer.xcarchive/Products/Applications" ]; then
            echo "SUCCESS: Archive created!"
            ls -la build/BionicDroneVisionServer.xcarchive/Products/Applications/
        else
            echo "FAILED: No archive found"
            echo "Last 100 lines of build log:"
            tail -100 build.log
            exit 1
        fi
    
    - name: Export IPA
      if: success()
      run: |
        cat > export.plist << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>method</key><string>development</string>
            <key>uploadSymbols</key><false/>
        </dict>
        </plist>
        EOF
        
        xcodebuild -exportArchive \
          -archivePath build/BionicDroneVisionServer.xcarchive \
          -exportPath build \
          -exportOptionsPlist export.plist \
          2>&1 | tee export.log
        
        echo "=== IPA Result ==="
        ls -la build/*.ipa 2>/dev/null || echo "IPA not created"
    
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: BionicDroneVisionServer
        path: build/*.ipa
        if-no-files-found: error
