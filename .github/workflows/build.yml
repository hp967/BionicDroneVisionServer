name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: macos-14
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.4'
    
    - name: Environment
      run: |
        xcodebuild -version
        swift --version
    
    - name: Create iOS App
      run: |
        mkdir -p BionicDroneVisionServer
        
        cat > BionicDroneVisionServer/main.swift << 'EOF'
        import SwiftUI
        @main
        struct BionicDroneVisionServerApp: App {
            var body: some Scene {
                WindowGroup {
                    Text("Bionic Drone Vision Server")
                        .font(.title)
                }
            }
        }
        EOF
        
        cat > BionicDroneVisionServer/Info.plist << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleExecutable</key><string>$(EXECUTABLE_NAME)</string>
            <key>CFBundleIdentifier</key><string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>$(PRODUCT_NAME)</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>LSRequiresIPhoneOS</key><true/>
            <key>UILaunchScreen</key><dict/>
            <key>UIRequiredDeviceCapabilities</key><array><string>arm64</string></array>
            <key>UISupportedInterfaceOrientations</key><array><string>UIInterfaceOrientationPortrait</string></array>
        </dict>
        </plist>
        EOF
        
        ls -la BionicDroneVisionServer/
    
    - name: Generate Xcode Project
      run: |
        # Install xcodegen
        brew install xcodegen
        
        # Create project spec
        cat > Project.yml << 'EOF'
        name: BionicDroneVisionServer
        options:
          bundleIdPrefix: com.bionicdrone
          deploymentTarget:
            iOS: "16.0"
        targets:
          BionicDroneVisionServer:
            type: application
            platform: iOS
            sources:
              - path: BionicDroneVisionServer
            settings:
              base:
                CODE_SIGNING_REQUIRED: NO
                CODE_SIGNING_ALLOWED: NO
                PRODUCT_BUNDLE_IDENTIFIER: com.bionicdrone.visionserver
        EOF
        
        # Generate project
        xcodegen generate
        
        echo "Generated project:"
        ls -la *.xcodeproj/
    
    - name: Build Archive
      run: |
        mkdir -p build
        
        xcodebuild archive \
          -project BionicDroneVisionServer.xcodeproj \
          -scheme BionicDroneVisionServer \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          -archivePath build/BionicDroneVisionServer.xcarchive \
          CODE_SIGNING_ALLOWED=NO \
          2>&1 | tee build.log
        
        echo "=== Archive Result ==="
        if [ -d "build/BionicDroneVisionServer.xcarchive/Products/Applications" ]; then
            echo "SUCCESS"
            ls -la build/BionicDroneVisionServer.xcarchive/Products/Applications/
        else
            echo "FAILED"
            tail -100 build.log
            exit 1
        fi
    
    - name: Export IPA
      run: |
        cat > export.plist << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>method</key><string>development</string>
            <key>uploadSymbols</key><false/>
        </dict>
        </plist>
        EOF
        
        xcodebuild -exportArchive \
          -archivePath build/BionicDroneVisionServer.xcarchive \
          -exportPath build \
          -exportOptionsPlist export.plist \
          2>&1 | tee export.log
        
        ls -la build/*.ipa 2>/dev/null || echo "IPA not created"
    
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: BionicDroneVisionServer
        path: build/*.ipa
        if-no-files-found: error
