name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-14
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.4'
    
    - name: Build IPA with Swift Package Manager
      run: |
        swift package --swift-sdk iphoneos-arm64 generate-xcodeproj
        xcodebuild archive           -project BionicDroneVisionServer.xcodeproj           -scheme BionicDroneVisionServer           -configuration Release           -destination 'generic/platform=iOS'           CODE_SIGNING_REQUIRED=NO           CODE_SIGN_IDENTITY=""           -archivePath build/BionicDroneVisionServer.xcarchive           2>&1 | tail -50
        ls -la build/
    
    - name: Export IPA
      run: |
        cat > export.plist << 'PLIST'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>method</key>
            <string>development</string>
            <key>uploadSymbols</key>
            <false/>
        </dict>
        </plist>
        PLIST
        
        xcodebuild -exportArchive           -archivePath build/BionicDroneVisionServer.xcarchive           -exportPath build/Products           -exportOptionsPlist export.plist
        ls -la build/Products/
    
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: BionicDroneVisionServer
        path: build/Products/BionicDroneVisionServer.ipa
