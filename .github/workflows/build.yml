name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: macos-14
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Environment
      run: |
        xcodebuild -version
        swift --version
        echo "HOME=$HOME"
    
    - name: Create iOS Application
      run: |
        mkdir -p BionicDroneVisionServer
        
        # Create main.swift
        cat > BionicDroneVisionServer/main.swift << 'EOF'
        import SwiftUI
        
        @main
        struct BionicDroneVisionServerApp: App {
            var body: some Scene {
                WindowGroup {
                    VStack(spacing: 20) {
                        Image(systemName: "drone.front.closed")
                            .font(.system(size: 80))
                            .foregroundColor(.blue)
                        
                        Text("Bionic Drone Vision")
                            .font(.title)
                            .fontWeight(.bold)
                        
                        Text("Server Ready")
                            .font(.caption)
                            .foregroundColor(.gray)
                    }
                    .padding()
                }
            }
        }
        EOF
        
        # Create Info.plist
        cat > BionicDroneVisionServer/Info.plist << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleExecutable</key>
            <string>$(EXECUTABLE_NAME)</string>
            <key>CFBundleIdentifier</key>
            <string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>$(PRODUCT_NAME)</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
            <key>UIApplicationSceneManifest</key>
            <dict>
                <key>UIApplicationSupportsMultipleScenes</key>
                <false/>
            </dict>
            <key>UIApplicationSupportsIndirectInputEvents</key>
            <true/>
            <key>UILaunchScreen</key>
            <dict/>
            <key>UIRequiredDeviceCapabilities</key>
            <array><string>arm64</string></array>
            <key>UISupportedInterfaceOrientations</key>
            <array><string>UIInterfaceOrientationPortrait</string></array>
        </dict>
        </plist>
        EOF
        
        echo "Created BionicDroneVisionServer/"
        ls -la BionicDroneVisionServer/
    
    - name: Generate Xcode Project with xcodegen
      run: |
        brew install xcodegen
        
        cat > Project.yml << 'YAML'
        name: BionicDroneVisionServer
        options:
          bundleIdPrefix: com.bionicdrone
          deploymentTarget:
            iOS: "16.0"
          
        targets:
          BionicDroneVisionServer:
            type: application
            platform: iOS
            sources:
              - path: BionicDroneVisionServer
            settings:
              base:
                CODE_SIGNING_REQUIRED: NO
                CODE_SIGNING_ALLOWED: NO
                PRODUCT_BUNDLE_IDENTIFIER: com.bionicdrone.visionserver
        YAML
        
        xcodegen generate
        ls -la *.xcodeproj/
    
    - name: Build Archive
      run: |
        mkdir -p build
        
        xcodebuild archive \
          -project BionicDroneVisionServer.xcodeproj \
          -scheme BionicDroneVisionServer \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          -archivePath build/BionicDroneVisionServer.xcarchive \
          CODE_SIGNING_ALLOWED=NO \
          2>&1 | tee build.log
        
        echo "=== Build Result ==="
        if [ -d "build/BionicDroneVisionServer.xcarchive/Products/Applications" ]; then
            echo "SUCCESS"
            ls -la build/BionicDroneVisionServer.xcarchive/Products/Applications/
        else
            echo "FAILED"
            tail -50 build.log
            exit 1
        fi
    
    - name: Export IPA
      run: |
        cat > export.plist << 'PLIST'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>method</key>
            <string>development</string>
            <key>uploadSymbols</key>
            <false/>
        </dict>
        </plist>
        PLIST
        
        xcodebuild -exportArchive \
          -archivePath build/BionicDroneVisionServer.xcarchive \
          -exportPath build \
          -exportOptionsPlist export.plist \
          2>&1 | tee export.log
        
        echo "=== Export Result ==="
        ls -la build/*.ipa 2>/dev/null || echo "IPA not found"
    
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: BionicDroneVisionServer
        path: build/*.ipa
        if-no-files-found: error
