name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.4'
        
    - name: Prepare source files
      run: |
        mkdir -p Sources/BionicDroneVisionServer
        cp *.swift Sources/BionicDroneVisionServer/
        cp BionicDroneVisionServer/*.swift Sources/BionicDroneVisionServer/
        cp BionicDroneVisionServer-Bridging-Header.h Sources/
        
    - name: Prepare llama.cpp
      run: |
        mkdir -p Sources/llama
        cp include/*.h Sources/llama/
        cp -r ggml/include/* Sources/llama/
        cp src/*.cpp Sources/llama/
        cp src/*.h Sources/llama/
        
    - name: Build
      run: |
        swift build -c release --arch arm64
        
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: build-output
        path: .build/release/
