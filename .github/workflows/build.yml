name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.4'
        
    - name: Prepare files
      run: |
        mkdir -p llama.cpp/include llama.cpp/src
        cp include/*.h llama.cpp/include/
        cp -r ggml/include/* llama.cpp/include/
        cp src/*.cpp llama.cpp/src/
        cp src/*.h llama.cpp/src/
        
    - name: Build
      run: |
        cd BionicDroneVisionServer
        swift build -c release
        
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: build-output
        path: BionicDroneVisionServer/.build/release/
