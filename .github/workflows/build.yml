name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: macos-14
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.4'
    
    - name: Environment
      run: |
        xcodebuild -version
        swift --version
    
    - name: Create iOS App
      run: |
        mkdir -p Sources
        
        cat > Sources/main.swift << 'EOF'
        import SwiftUI
        
        @main
        struct BionicDroneVisionServerApp: App {
            var body: some Scene {
                WindowGroup {
                    VStack {
                        Image(systemName: "drone.front.closed")
                            .font(.system(size: 60))
                        Text("Bionic Drone Vision Server")
                            .font(.title)
                    }
                    .padding()
                }
            }
        }
        EOF
        
        cat > Sources/Info.plist << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleExecutable</key>
            <string>$(EXECUTABLE_NAME)</string>
            <key>CFBundleIdentifier</key>
            <string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>$(PRODUCT_NAME)</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
            <key>UILaunchScreen</key>
            <dict/>
            <key>UIRequiredDeviceCapabilities</key>
            <array><string>arm64</string></array>
            <key>UISupportedInterfaceOrientations</key>
            <array><string>UIInterfaceOrientationPortrait</string></array>
        </dict>
        </plist>
        EOF
        
        ls -la Sources/
    
    - name: Build Archive
      run: |
        # Create a proper Xcode project using xcodegen
        brew install xcodegen
        
        cat > Project.yml << 'YAML'
        name: BionicDroneVisionServer
        options:
          bundleIdPrefix: com.bionicdrone
          deploymentTarget:
            iOS: "16.0"
          
        targets:
          BionicDroneVisionServer:
            type: application
            platform: iOS
            sources:
              - path: Sources
            settings:
              base:
                CODE_SIGNING_REQUIRED: NO
                CODE_SIGNING_ALLOWED: NO
                PRODUCT_BUNDLE_IDENTIFIER: com.bionicdrone.visionserver
        YAML
        
        xcodegen generate
        
        echo "=== Generated Project ==="
        ls -la *.xcodeproj/
        
        echo "=== Building Archive ==="
        xcodebuild archive \
          -project BionicDroneVisionServer.xcodeproj \
          -scheme BionicDroneVisionServer \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          -archivePath build/BionicDroneVisionServer.xcarchive \
          2>&1 | tee build.log
        
        echo "=== Build Result ==="
        if [ -d "build/BionicDroneVisionServer.xcarchive" ]; then
            echo "SUCCESS: Archive created"
            ls -la build/BionicDroneVisionServer.xcarchive/Products/Applications/
        else
            echo "FAILED: Archive not found"
            tail -50 build.log
            exit 1
        fi
    
    - name: Export IPA
      if: success()
      run: |
        cat > export.plist << 'PLIST'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>method</key>
            <string>development</string>
            <key>uploadSymbols</key>
            <false/>
        </dict>
        </plist>
        PLIST
        
        xcodebuild -exportArchive \
          -archivePath build/BionicDroneVisionServer.xcarchive \
          -exportPath build \
          -exportOptionsPlist export.plist \
          2>&1 | tee export.log
        
        ls -la build/*.ipa 2>/dev/null || echo "IPA not created"
    
    - name: Upload IPA
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: BionicDroneVisionServer
        path: build/*.ipa
