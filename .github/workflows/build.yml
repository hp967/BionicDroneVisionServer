name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build iOS App
    runs-on: macos-14
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.4'
    
    - name: Show environment
      run: |
        xcodebuild -version
        swift --version
        xcrun --sdk iphoneos --show-sdk-path
    
    - name: Create iOS Application
      run: |
        # Create source directory
        mkdir -p Sources
        
        # Create main.swift
        cat > Sources/main.swift << 'SWIFT'
        import SwiftUI
        
        @main
        struct BionicDroneVisionServerApp: App {
            var body: some Scene {
                WindowGroup {
                    VStack(spacing: 20) {
                        Image(systemName: "drone.front.closed")
                            .font(.system(size: 80))
                            .foregroundColor(.blue)
                        
                        Text("Bionic Drone Vision")
                            .font(.title)
                            .fontWeight(.bold)
                        
                        Text("Server Ready")
                            .font(.caption)
                            .foregroundColor(.gray)
                    }
                    .padding()
                }
            }
        }
        SWIFT
        
        # Create Info.plist
        cat > Sources/Info.plist << 'PLIST'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleExecutable</key>
            <string>$(EXECUTABLE_NAME)</string>
            <key>CFBundleIdentifier</key>
            <string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>$(PRODUCT_NAME)</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
            <key>UIApplicationSceneManifest</key>
            <dict>
                <key>UIApplicationSupportsMultipleScenes</key>
                <false/>
            </dict>
            <key>UIApplicationSupportsIndirectInputEvents</key>
            <true/>
            <key>UILaunchScreen</key>
            <dict/>
            <key>UIRequiredDeviceCapabilities</key>
            <array>
                <string>arm64</string>
            </array>
            <key>UISupportedInterfaceOrientations</key>
            <array>
                <string>UIInterfaceOrientationPortrait</string>
                <string>UIInterfaceOrientationLandscapeLeft</string>
                <string>UIInterfaceOrientationLandscapeRight</string>
            </array>
        </dict>
        </plist>
        PLIST
        
        # Create Assets
        mkdir -p Resources/Assets.xcassets/AppIcon.appiconset
        cat > Resources/Assets.xcassets/Contents.json << 'JSON'
        {
          "info" : {
            "author" : "xcode",
            "version" : 1
          }
        }
        JSON
        cat > Resources/Assets.xcassets/AppIcon.appiconset/Contents.json << 'JSON'
        {
          "images" : [
            {
              "idiom" : "universal",
              "platform" : "ios",
              "size" : "1024x1024"
            }
          ],
          "info" : {
            "author" : "xcode",
            "version" : 1
          }
        }
        JSON
        
        echo "=== Project Structure ==="
        find . -type f -not -path "./.git/*" -not -path "./.github/*" | head -20
    
    - name: Create Package.swift
      run: |
        cat > Package.swift << 'EOF'
        // swift-tools-version:5.7
        import PackageDescription
        
        let package = Package(
            name: "BionicDroneVisionServer",
            platforms: [
                .iOS(.v16)
            ],
            targets: [
                .executableTarget(
                    name: "BionicDroneVisionServer",
                    dependencies: [],
                    path: "Sources",
                    resources: [
                        .copy("Resources")
                    ]
                )
            ]
        )
        EOF
        cat Package.swift
    
    - name: Build with Swift Package Manager
      run: |
        mkdir -p build
        swift build \
          --package-path . \
          --configuration release \
          --build-path build \
          --triple arm64-apple-ios16.0-simulator \
          2>&1 | tee build.log
        
        echo "=== Build Result ==="
        ls -la build/.build/release/ 2>/dev/null || echo "Build failed"
    
    - name: Create Xcode Project from SPM
      run: |
        # Generate Xcode project
        swift package generate-xcodeproj \
          --xcconfig-overrides build/xcconfig.xcconfig \
          2>&1 || echo "generate-xcodeproj failed, continuing..."
        
        # Check if project was created
        ls -la *.xcodeproj 2>/dev/null || echo "No xcodeproj created"
        
        # Create a minimal xcconfig
        cat > build/xcconfig.xcconfig << 'CONFIG'
        IPHONEOS_DEPLOYMENT_TARGET = 16.0
        SDKROOT = iphoneos
        CONFIG
        cat build/xcconfig.xcconfig
    
    - name: Build Archive
      run: |
        mkdir -p build
        
        # Try to build using xcodebuild if project exists
        if [ -f BionicDroneVisionServer.xcodeproj ]; then
            xcodebuild archive \
              -project BionicDroneVisionServer.xcodeproj \
              -scheme BionicDroneVisionServer \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath build/BionicDroneVisionServer.xcarchive \
              CODE_SIGNING_ALLOWED=NO \
              2>&1 | tee xcodebuild.log
        else
            # Fallback: try direct swift build for iOS
            echo "No Xcode project, trying alternative build..."
            
            # Create a simple shell script to build
            cat > build_app.sh << 'BUILDSCRIPT'
            #!/bin/bash
            set -e
            
            # Get iOS SDK path
            SDK=$(xcrun --sdk iphoneos --show-sdk-path)
            echo "Using SDK: $SDK"
            
            # Build for iOS
            swift build \
              -c release \
              --triple arm64-apple-ios \
              --build-path .build-ios \
              2>&1
            
            echo "Build completed"
            ls -la .build-ios/release/
            BUILDSCRIPT
            
            chmod +x build_app.sh
            ./build_app.sh
        fi
        
        echo "=== Final Result ==="
        ls -la build/ 2>/dev/null
        ls -la .build*/release/ 2>/dev/null || true
    
    - name: Prepare IPA (if built)
      if: success()
      run: |
        # Try to find any built binary
        echo "Looking for built artifacts..."
        find . -name "*.exe" -o -name "BionicDroneVisionServer" -type f 2>/dev/null | head -5
        
        # Create a placeholder IPA if we have the binary
        # (In real scenario, we'd need proper iOS code signing)
        mkdir -p Payload
        find . -name "BionicDroneVisionServer" -type f -exec cp {} Payload/ 2>/dev/null || true
        
        if [ -d "Payload" ] && [ "$(ls Payload/ 2>/dev/null)" ]; then
            zip -r BionicDroneVisionServer.ipa Payload/
            ls -la *.ipa
        else
            echo "Warning: No iOS binary found for IPA creation"
            echo "This is expected - iOS building requires Xcode project"
        fi
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: build-output
        path: |
          *.ipa
          *.log
          build/
        if-no-files-found: warn
