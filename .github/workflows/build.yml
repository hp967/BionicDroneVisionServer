name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build iOS App
    runs-on: macos-14
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.4'
    
    - name: Show environment
      run: |
        xcodebuild -version
        xcrun --sdk iphoneos --show-sdk-path
    
    - name: Create Xcode Project
      run: |
        # Create project structure
        mkdir -p BionicDroneVisionServer
        cp -r App/* BionicDroneVisionServer/
        
        # Create Assets catalog
        mkdir -p BionicDroneVisionServer/Resources/Assets.xcassets/AppIcon.appiconset
        cat > BionicDroneVisionServer/Resources/Assets.xcassets/Contents.json << 'JSON'
        {
          "info" : {
            "author" : "xcode",
            "version" : 1
          }
        }
        JSON
        cat > BionicDroneVisionServer/Resources/Assets.xcassets/AppIcon.appiconset/Contents.json << 'JSON'
        {
          "images" : [
            {
              "idiom" : "universal",
              "platform" : "ios",
              "size" : "1024x1024"
            }
          ],
          "info" : {
            "author" : "xcode",
            "version" : 1
          }
        }
        JSON
        
        echo "Project structure created"
        ls -laR BionicDroneVisionServer/
    
    - name: Generate Xcode Project
      run: |
        cd BionicDroneVisionServer
        xcodebuild -create-xcode-project \
          -projectName BionicDroneVisionServer \
          -folderPath . \
          -scheme BionicDroneVisionServer \
          -target BionicDroneVisionServer \
          -targetDeviceFamily iphone,iPad \
          -deploymentTarget 16.0 \
          -interface SwiftUI \
          -language Swift
        ls -la *.xcodeproj/
    
    - name: Build Archive
      run: |
        mkdir -p build
        xcodebuild archive \
          -project BionicDroneVisionServer.xcodeproj \
          -scheme BionicDroneVisionServer \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          -archivePath build/BionicDroneVisionServer.xcarchive \
          CODE_SIGNING_ALLOWED=NO \
          2>&1 | tee build.log
        
        echo "=== Build Result ==="
        if [ -f build/BionicDroneVisionServer.xcarchive ]; then
            echo "SUCCESS: Archive created"
            ls -la build/BionicDroneVisionServer.xcarchive/
            ls -la build/BionicDroneVisionServer.xcarchive/Products/Applications/
        else
            echo "FAILED: Archive not found"
            tail -50 build.log
            exit 1
        fi
    
    - name: Export IPA
      run: |
        cat > export.plist << 'PLIST'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>method</key>
            <string>development</string>
            <key>uploadSymbols</key>
            <false/>
        </dict>
        </plist>
        PLIST
        
        xcodebuild -exportArchive \
          -archivePath build/BionicDroneVisionServer.xcarchive \
          -exportPath build \
          -exportOptionsPlist export.plist \
          2>&1 | tee export.log
        
        echo "=== Export Result ==="
        ls -la build/*.ipa 2>/dev/null || echo "IPA not found"
    
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: BionicDroneVisionServer
        path: build/*.ipa
        if-no-files-found: error
