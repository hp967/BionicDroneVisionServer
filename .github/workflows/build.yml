name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-14
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.4'
    
    - name: Build with Swift
      run: |
        swift build -c release --swift-sdk iphoneos-arm64
        ls -la .build/release/
    
    - name: Create IPA
      run: |
        ditto -ck --rsrc --sequesterRsrc .build/release/BionicDroneVisionServer build/app.zip
        mkdir -p Payload
        cp .build/release/BionicDroneVisionServer Payload/BionicDroneVisionServer
        ditto -ck --rsrc --sequesterRsrc Payload BionicDroneVisionServer.ipa
        ls -la *.ipa
    
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: BionicDroneVisionServer
        path: BionicDroneVisionServer.ipa
