name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: macos-14
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.4'
    
    - name: Environment
      run: |
        echo "=== Environment ==="
        xcodebuild -version
        swift --version
        echo "SDK Paths:"
        xcrun --sdk iphoneos --show-sdk-path
        xcrun --sdk iphonesimulator --show-sdk-path
    
    - name: Create iOS App
      run: |
        echo "Creating project structure..."
        mkdir -p MyApp
        
        # Create main.swift
        cat > MyApp/main.swift << 'EOF'
        import SwiftUI
        @main
        struct MyApp: App {
            var body: some Scene {
                WindowGroup {
                    Text("Hello iOS")
                }
            }
        }
        EOF
        
        # Create minimal Info.plist
        cat > MyApp/Info.plist << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleExecutable</key><string>$(EXECUTABLE_NAME)</string>
            <key>CFBundleIdentifier</key><string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>$(PRODUCT_NAME)</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>LSRequiresIPhoneOS</key><true/>
            <key>UILaunchScreen</key><dict/>
            <key>UIRequiredDeviceCapabilities</key><array><string>arm64</string></array>
            <key>UISupportedInterfaceOrientations</key><array><string>UIInterfaceOrientationPortrait</string></array>
        </dict>
        </plist>
        EOF
        
        echo "Created MyApp directory:"
        ls -la MyApp/
    
    - name: Build for iOS Simulator
      run: |
        echo "=== Building for iOS Simulator ==="
        mkdir -p build
        
        # Use xcodebuild to build for simulator
        xcodebuild build \
          -scheme MyApp \
          -configuration Debug \
          -destination 'platform=iOS Simulator,name=iPhone 15' \
          -derivedDataPath build \
          CODE_SIGNING_ALLOWED=NO \
          2>&1 | tee build_sim.log
        
        echo "=== Build Result ==="
        find build -name "*.app" -type d 2>/dev/null | head -5
    
    - name: Build for iOS Device
      run: |
        echo "=== Building for iOS Device ==="
        mkdir -p build
        
        # Try building for device
        xcodebuild build \
          -destination 'generic/platform=iOS' \
          -configuration Release \
          -derivedDataPath build \
          CODE_SIGNING_ALLOWED=NO \
          OTHER_CFLAGS="-headerpad_max_install_names" \
          2>&1 | tee build_device.log
        
        echo "=== Build Result ==="
        find build -name "*.o" -o -name "*.exe" -o -name "MyApp" -type f 2>/dev/null | head -10
    
    - name: Create IPA (Manual)
      run: |
        echo "=== Creating IPA manually ==="
        
        # Find any built binary
        APP_PATH=$(find . -name "*.app" -type d 2>/dev/null | head -1)
        
        if [ -n "$APP_PATH" ]; then
            echo "Found app: $APP_PATH"
            
            # Create Payload directory
            mkdir -p Payload
            cp -r "$APP_PATH" Payload/
            
            # Create IPA (it's just a zip)
            cd Payload
            zip -r ../MyApp.ipa ./*
            cd ..
            
            ls -la *.ipa
        else
            echo "No .app found, creating placeholder"
            # Create a placeholder file
            echo "Placeholder IPA - no build artifact found" > README.txt
        fi
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BionicDroneVisionServer
        path: |
          *.ipa
          *.log
          build/
        if-no-files-found: warn
