name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Create iOS app files
      run: |
        mkdir -p App
        cat > App/main.swift << 'SWIFTEOF'
        import SwiftUI
        @main
        struct App: App {
            var body: some Scene {
                WindowGroup {
                    Text("Hello iOS")
                }
            }
        }
        SWIFTEOF
        
        cat > App/Info.plist << 'PLISTEOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleExecutable</key>
            <string>$(EXECUTABLE_NAME)</string>
            <key>CFBundleIdentifier</key>
            <string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>$(PRODUCT_NAME)</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
            <key>UIApplicationSceneManifest</key>
            <dict>
                <key>UIApplicationSupportsMultipleScenes</key>
                <false/>
            </dict>
            <key>UIApplicationSupportsIndirectInputEvents</key>
            <true/>
            <key>UILaunchScreen</key>
            <dict/>
            <key>UIRequiredDeviceCapabilities</key>
            <array>
                <string>arm64</string>
            </array>
            <key>UISupportedInterfaceOrientations</key>
            <array>
                <string>UIInterfaceOrientationPortrait</string>
            </array>
        </dict>
        </plist>
        PLISTEOF
        ls -la App/
    
    - name: Create Xcode project file
      run: |
        mkdir -p App.xcodeproj
        cat > App.xcodeproj/project.pbxproj << 'XCPROJ'
        // !$*UTF8*$!
        {
        	archiveVersion = 1;
        	classes = {
        	};
        	objectVersion = 50;
        	objects = {
        
        /* Begin PBXBuildFile section */
        		1A000001 /* main.swift in Sources */ = {isa = PBXBuildFile; fileRef = 2A000001; };
        /* End PBXBuildFile section */
        
        /* Begin PBXFileReference section */
        		2A000001 /* main.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = main.swift; sourceTree = "<group>"; };
        		3A000001 /* App.app */ = {isa = PBXFileReference; explicitFileType = wrapper.application; includeInIndex = 0; path = App.app; sourceTree = BUILT_PRODUCTS_DIR; };
        		4A000001 /* Info.plist */ = {isa = PBXFileReference; lastKnownFileType = text.plist.xml; path = Info.plist; sourceTree = "<group>"; };
        /* End PBXFileReference section */
        
        /* Begin PBXFrameworksBuildPhase section */
        		5A000001 /* Frameworks */ = {
        			isa = PBXFrameworksBuildPhase;
        			buildActionMask = 2147483647;
        			files = (
        			);
        			runOnlyForDeploymentPostprocessing = 0;
        		};
        /* End PBXFrameworksBuildPhase section */
        
        /* Begin PBXGroup section */
        		6A000001 = {
        			isa = PBXGroup;
        			children = (
        				7A000001 /* App */,
        				8A000001 /* Frameworks */,
        				9A000001 /* Products */,
        			);
        			sourceTree = "<group>";
        		};
        		7A000001 /* App */ = {
        			isa = PBXGroup;
        			children = (
        				2A000001,
        				4A000001,
        			);
        			path = App;
        			sourceTree = "<group>";
        		};
        		8A000001 /* Frameworks */ = {
        			isa = PBXGroup;
        			name = Frameworks;
        			sourceTree = "<group>";
        		};
        		9A000001 /* Products */ = {
        			isa = PBXGroup;
        			children = (
        				3A000001,
        			);
        			name = Products;
        			sourceTree = "<group>";
        		};
        /* End PBXGroup section */
        
        /* Begin PBXNativeTarget section */
        		10A000001 /* App */ = {
        			isa = PBXNativeTarget;
        			buildConfigurationList = 11A000001;
        			buildPhases = (
        				12A000001,
        				5A000001,
        			);
        			buildRules = (
        			);
        			dependencies = (
        			);
        			name = App;
        			productName = App;
        			productReference = 3A000001;
        			productType = "com.apple.product-type.application";
        		};
        /* End PBXNativeTarget section */
        
        /* Begin PBXProject section */
        		13A000001 /* Project object */ = {
        			isa = PBXProject;
        			attributes = {
        				BuildIndependentTargetsInParallel = 1;
        			};
        			buildConfigurationList = 14A000002;
        			compatibilityVersion = "Xcode 3.2";
        			developmentRegion = en;
        			hasScannedForEncodings = 0;
        			knownRegions = (
        				en,
        				Base,
        			);
        			mainGroup = 6A000001;
        			productRefGroup = 9A000001;
        			projectDirPath = "";
        			projectRoot = "";
        			targets = (
        				10A000001,
        			);
        		};
        /* End PBXProject section */
        
        /* Begin PBXSourcesBuildPhase section */
        		12A000001 /* Sources */ = {
        			isa = PBXSourcesBuildPhase;
        			buildActionMask = 2147483647;
        			files = (
        				1A000001,
        			);
        			runOnlyForDeploymentPostprocessing = 0;
        		};
        /* End PBXSourcesBuildPhase section */
        
        /* Begin XCBuildConfiguration section */
        		11A000001 /* Release */ = {
        			isa = XCBuildConfiguration;
        			buildSettings = {
        				ALWAYS_SEARCH_USER_PATHS = NO;
        				CLANG_ENABLE_MODULES = YES;
        				COPY_PHASE_STRIP = NO;
        				DEBUG_INFORMATION_FORMAT = "dwarf-with-dsym";
        				IPHONEOS_DEPLOYMENT_TARGET = 13.0;
        				MTL_ENABLE_DEBUG_INFO = NO;
        				ONLY_ACTIVE_ARCH = YES;
        				SDKROOT = iphoneos;
        				TARGETED_DEVICE_FAMILY = "1,2";
        			};
        			name = Release;
        		};
        		15A000001 /* Release */ = {
        			isa = XCBuildConfiguration;
        			buildSettings = {
        				ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon;
        				CODE_SIGN_STYLE = Automatic;
        				CURRENT_PROJECT_VERSION = 1;
        				DEVELOPMENT_TEAM = "";
        				GENERATE_INFOPLIST_FILE = NO;
        				INFOPLIST_FILE = App/Info.plist;
        				IPHONEOS_DEPLOYMENT_TARGET = 13.0;
        				LD_RUNPATH_SEARCH_PATHS = (
        					"@executable_path/Frameworks",
        				);
        				PRODUCT_BUNDLE_IDENTIFIER = com.bionicdrone.visionserver;
        				PRODUCT_NAME = "$(TARGET_NAME)";
        				SWIFT_EMIT_LOC_STRINGS = YES;
        				SWIFT_VERSION = 5.0;
        				TARGETED_DEVICE_FAMILY = "1,2";
        			};
        			name = Release;
        		};
        /* End XCBuildConfiguration section */
        
        /* Begin XCConfigurationList section */
        		11A000001 /* Build configuration list for PBXNativeTarget "App" */ = {
        			isa = XCConfigurationList;
        			buildConfigurations = (
        				11A000001,
        			);
        			defaultConfigurationIsVisible = 0;
        		};
        		14A000002 /* Build configuration list for PBXProject "App" */ = {
        			isa = XCConfigurationList;
        			buildConfigurations = (
        				15A000001,
        			);
        			defaultConfigurationIsVisible = 0;
        		};
        /* End XCConfigurationList section */
        
        	};
        	rootObject = 13A000001;
        }
        XCPROJ
        ls -la App.xcodeproj/
    
    - name: Build Archive
      run: |
        mkdir -p build
        xcodebuild archive \
          -project App.xcodeproj \
          -scheme App \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          -archivePath build/App.xcarchive \
          2>&1 | tee build.log
        tail -30 build.log
        ls -la build/
    
    - name: Export IPA
      run: |
        echo "Checking archive..."
        ls -la build/App.xcarchive/
        ls -la build/App.xcarchive/Products/Applications/
        
        # Create export options plist
        cat > export.plist << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>method</key>
            <string>development</string>
            <key>uploadSymbols</key>
            <false/>
            <key>compileBitcode</key>
            <false/>
            <key>thinning</key>
            <string><none></string>
        </dict>
        </plist>
        EOF
        
        echo "Exporting IPA..."
        xcrun xcodebuild -exportArchive \
          -archivePath build/App.xcarchive \
          -exportPath build/Products \
          -exportOptionsPlist export.plist \
          2>&1 | tee export.log
        
        echo "Export output:"
        tail -20 export.log
        ls -la build/Products/
    
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: App
        path: build/Products/App.ipa
