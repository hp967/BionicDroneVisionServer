name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.4'
        
    - name: Create Xcode Project
      run: |
        xcodebuild -create-xcode-project \
          -projectName BionicDroneVisionServer \
          -folderPath . \
          -scheme BionicDroneVisionServer \
          -target BionicDroneVisionServer \
          -targetDeviceFamily iphone,iPad \
          -deploymentTarget 17.0 \
          -interface SwiftUI \
          -language Swift
          
    - name: Add llama.cpp
      run: |
        mkdir -p BionicDroneVisionServer/llama.cpp
        cp -r llama.cpp/* BionicDroneVisionServer/llama.cpp/
        
    - name: Build Archive
      run: |
        xcodebuild archive \
          -project BionicDroneVisionServer.xcodeproj \
          -scheme BionicDroneVisionServer \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          -archivePath build/BionicDroneVisionServer.xcarchive
          
    - name: Export IPA
      run: |
        cat > export.plist << 'PLIST'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>method</key>
            <string>development</string>
            <key>uploadSymbols</key>
            <true/>
        </dict>
        </plist>
        PLIST
        
        xcodebuild -exportArchive \
          -archivePath build/BionicDroneVisionServer.xcarchive \
          -exportPath build/Products \
          -exportOptionsPlist export.plist
          
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: BionicDroneVisionServer
        path: build/Products/*.ipa
