name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: macos-14
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.4'
    
    - name: Create iOS App
      run: |
        mkdir -p Sources
        
        cat > Sources/main.swift << 'EOF'
        import SwiftUI
        @main
        struct BionicDroneVisionServerApp: App {
            var body: some Scene {
                WindowGroup {
                    VStack {
                        Image(systemName: "drone.front.closed")
                            .font(.system(size: 60))
                        Text("Bionic Drone Vision Server")
                            .font(.title)
                    }
                    .padding()
                }
            }
        }
        EOF
        
        cat > Sources/Info.plist << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleExecutable</key><string>$(EXECUTABLE_NAME)</string>
            <key>CFBundleIdentifier</key><string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>$(PRODUCT_NAME)</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>LSRequiresIPhoneOS</key><true/>
            <key>UILaunchScreen</key><dict/>
            <key>UIRequiredDeviceCapabilities</key><array><string>arm64</string></array>
            <key>UISupportedInterfaceOrientations</key><array><string>UIInterfaceOrientationPortrait</string></array>
        </dict>
        </plist>
        EOF
        
        ls -la Sources/
    
    - name: Build with Swift
      run: |
        # Create Package.swift
        cat > Package.swift << 'EOF'
        // swift-tools-version:5.7
        import PackageDescription
        let package = Package(
            name: "BionicDroneVisionServer",
            platforms: [.iOS(.v16)],
            targets: [
                .executableTarget(
                    name: "BionicDroneVisionServer",
                    dependencies: [],
                    path: "Sources"
                )
            ]
        )
        EOF
        
        # Try building
        mkdir -p build
        swift build -c release --build-path build 2>&1 | tee swift_build.log
        
        echo "=== Build Result ==="
        ls -la build/.build/release/ 2>/dev/null || echo "No release binary"
        ls -la build/ 2>/dev/null
    
    - name: Create Xcode Project
      if: failure()
      run: |
        echo "Swift build failed, trying alternative..."
        # This step is just for debugging
        echo "Checking environment..."
        xcodebuild -version
        swift --version
    
    - name: Generate Xcode Project
      run: |
        # Install xcodegen
        brew install xcodegen 2>&1 || echo "xcodegen install failed"
        
        # Create project specification
        cat > Project.yml << 'EOF'
        name: BionicDroneVisionServer
        options:
          bundleIdPrefix: com.bionicdrone
          deploymentTarget:
            iOS: "16.0"
        targets:
          BionicDroneVisionServer:
            type: application
            platform: iOS
            sources:
              - path: Sources
            settings:
              base:
                CODE_SIGNING_REQUIRED: NO
                CODE_SIGNING_ALLOWED: NO
                PRODUCT_BUNDLE_IDENTIFIER: com.bionicdrone.visionserver
        EOF
        
        # Generate the Xcode project
        xcodegen generate 2>&1 || echo "xcodegen failed"
        
        ls -la *.xcodeproj 2>/dev/null || echo "No xcodeproj generated"
    
    - name: Build Archive
      if: success() || contains(github.event.head_commit.message, 'Build Archive')
      run: |
        mkdir -p build
        
        # Check if we have an xcodeproj
        if [ -d "BionicDroneVisionServer.xcodeproj" ]; then
            xcodebuild archive \
              -project BionicDroneVisionServer.xcodeproj \
              -scheme BionicDroneVisionServer \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath build/BionicDroneVisionServer.xcarchive \
              CODE_SIGNING_ALLOWED=NO \
              2>&1 | tee build.log
        else
            echo "No Xcode project found, trying direct build..."
            # Try building directly
            xcodebuild build \
              -destination 'generic/platform=iOS' \
              -configuration Release \
              CODE_SIGNING_ALLOWED=NO \
              2>&1 | tee direct_build.log
        fi
        
        echo "=== Final Result ==="
        ls -la build/ 2>/dev/null || true
        ls -la *.xcarchive 2>/dev/null || true
