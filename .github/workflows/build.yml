name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-14
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.4'
    
    - name: Build with Swift Package Manager
      run: |
        swift build -c release
        echo "Build successful!"
        ls -la .build/release/
    
    - name: Create Xcode Project
      run: |
        xcodebuild -create-xcode-project \
          -projectName BionicDroneVisionServer \
          -folderPath . \
          -scheme BionicDroneVisionServer \
          -target BionicDroneVisionServer \
          -targetDeviceFamily iphone,iPad \
          -deploymentTarget 17.0 \
          -interface SwiftUI \
          -language Swift \
          -output BionicDroneVisionServer.xcodeproj
    
    - name: Build Archive
      run: |
        xcodebuild archive \
          -project BionicDroneVisionServer.xcodeproj \
          -scheme BionicDroneVisionServer \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          -archivePath build/BionicDroneVisionServer.xcarchive
    
    - name: Export IPA
      run: |
        cat > export.plist << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>method</key>
            <string>development</string>
            <key>uploadSymbols</key>
            <false/>
        </dict>
        </plist>
        EOF
        
        xcodebuild -exportArchive \
          -archivePath build/BionicDroneVisionServer.xcarchive \
          -exportPath build/Products \
          -exportOptionsPlist export.plist
    
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: BionicDroneVisionServer
        path: build/Products/BionicDroneVisionServer.ipa
